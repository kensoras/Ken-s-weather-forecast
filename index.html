<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国お天気マップ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      overflow: hidden; /* 1画面固定でスクロール防止 */
    }
    body {
      font-family: sans-serif;
      background-color: #0b132b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .header-title {
      font-size: 1.2rem;
      color: #ffffff;
      margin-bottom: 8px;
      text-align: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 画像と枠の縦横比を100%完全一致させるコンテナ */
    .map-container {
      position: relative;
      display: inline-block;
      width: auto;
      max-width: 100%;
      max-height: calc(100vh - 60px); /* 1画面に収まる上限高さ */
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      overflow: hidden;
      border: 2px solid #334155;
    }
    
    .japan-map {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 60px);
      object-fit: contain;
    }

    /* 天気カード（重なりを防ぐコンパクトサイズ） */
    .weather-card {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.94);
      padding: 3px 6px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      border: 1px solid #d0d0d0;
      min-width: 48px;
      z-index: 10;
    }
    .city-name {
      font-size: 0.65rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 1px;
    }
    .weather-icon {
      font-size: 1.1rem;
      line-height: 1;
    }
    .temp {
      font-size: 0.6rem;
      font-weight: bold;
      color: #e53e3e;
    }
  </style>
</head>
<body>

  <div class="header-title">☀️ 全国のお天気</div>

  <div class="map-container">
    <img class="japan-map" src="map.jpg" alt="日本地図">
    <div id="map-content"></div>
  </div>

  <script>
    // カード同士が被らないよう隣接都市の座標を少し引き離して微調整
    const weatherData = [
      { city: "札幌", icon: "☁️", temp: "22℃", x: 60, y: 16 },
      { city: "仙台", icon: "🌤️", temp: "26℃", x: 65, y: 46 },
      { city: "新潟", icon: "☔", temp: "25℃", x: 50, y: 40 },
      { city: "金沢", icon: "☔", temp: "25℃", x: 38, y: 52 },
      { city: "東京", icon: "☀️", temp: "31℃", x: 60, y: 66 },
      { city: "名古屋", icon: "☀️", temp: "32℃", x: 48, y: 78 },
      { city: "大阪", icon: "🌤️", temp: "30℃", x: 35, y: 70 },
      { city: "広島", icon: "☀️", temp: "31℃", x: 23, y: 64 },
      { city: "福岡", icon: "🌧️", temp: "28℃", x: 10, y: 72 },
      { city: "鹿児島", icon: "⚡", temp: "29℃", x: 12, y: 88 },
      { city: "那覇", icon: "☀️", temp: "33℃", x: 70, y: 92 }
    ];

    const mapContent = document.getElementById("map-content");

    weatherData.forEach(item => {
      const card = document.createElement("div");
      card.className = "weather-card";
      card.style.left = item.x + "%";
      card.style.top = item.y + "%";

      card.innerHTML = `
        <div class="city-name">${item.city}</div>
        <div class="weather-icon">${item.icon}</div>
        <div class="temp">${item.temp}</div>
      `;

      mapContent.appendChild(card);
    });
  </script>

</body>
</html>
