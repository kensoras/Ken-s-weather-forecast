<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国お天気マップ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      overflow: hidden; /* スクロール禁止で1画面表示 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0b132b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 上詰めで広々表示 */
      padding: 10px 5px;
    }
    .header-title {
      font-size: 1.3rem;
      color: #ffffff;
      margin: 5px 0 10px 0;
      text-align: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 地図コンテナ：スマホ画面の横幅いっぱいに拡大 */
    .map-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 2px solid #334155;
    }
    
    .japan-map {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* 天気カード：超スリム＆スタイリッシュな縦長デザイン */
    .weather-card {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 3px 2px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      border: 1px solid #dcdcdc;
      width: 36px; /* 横幅を限界までスリム化して重なり防止 */
      z-index: 10;
    }
    .city-name {
      font-size: 0.6rem;
      font-weight: bold;
      color: #222;
      line-height: 1;
      margin-bottom: 2px;
    }
    .weather-icon {
      font-size: 1rem;
      line-height: 1;
    }
    .temp {
      font-size: 0.55rem;
      font-weight: bold;
      color: #e53e3e;
      line-height: 1;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="header-title">☀️ 全国のお天気</div>

  <div class="map-container">
    <img class="japan-map" src="map.jpg" alt="日本地図">
    <div id="map-content"></div>
  </div>

  <script>
    // 縦長カードが重ならないよう、日本列島の傾きに沿って座標を再調整
    const weatherData = [
      { city: "札幌", icon: "☁️", temp: "22℃", x: 62, y: 18 },
      { city: "仙台", icon: "🌤️", temp: "26℃", x: 66, y: 53 },
      { city: "新潟", icon: "☔", temp: "25℃", x: 48, y: 45 },
      { city: "金沢", icon: "☔", temp: "25℃", x: 45, y: 52 },
      { city: "東京", icon: "☀️", temp: "31℃", x: 57, y: 81 },
      { city: "名古屋", icon: "☀️", temp: "32℃", x: 47, y: 83 },
      { city: "大阪", icon: "🌤️", temp: "30℃", x: 35, y: 70 },
      { city: "広島", icon: "☀️", temp: "31℃", x: 23, y: 65 },
      { city: "福岡", icon: "🌧️", temp: "28℃", x: 10, y: 80 },
      { city: "鹿児島", icon: "⚡", temp: "29℃", x: 30, y: 90 },
      { city: "那覇", icon: "☀️", temp: "33℃", x: 85, y: 86 }
    ];

    const mapContent = document.getElementById("map-content");

    weatherData.forEach(item => {
      const card = document.createElement("div");
      card.className = "weather-card";
      card.style.left = item.x + "%";
      card.style.top = item.y + "%";

      card.innerHTML = `
        <div class="city-name">${item.city}</div>
        <div class="weather-icon">${item.icon}</div>
        <div class="temp">${item.temp}</div>
      `;

      mapContent.appendChild(card);
    });
  </script>

</body>
</html>
