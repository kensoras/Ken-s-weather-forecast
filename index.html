<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国お天気マップ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100vh;
      overflow: hidden; /* スクロール禁止で1画面表示 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #e0f2fe;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* 上詰めで広々表示 */
      padding: 10px 5px;
    }
    .header-title {
      font-size: 1.3rem;
      color: #0f172a;
      margin: 5px 0 10px 0;
      text-align: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* 地図コンテナ：スマホ画面の横幅いっぱいに拡大 */
    .map-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      overflow: hidden;
      border: 2px solid #334155;
    }
    
    .japan-map {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* 天気カード：超スリム＆スタイリッシュな縦長デザイン */
    .weather-card {
      position: absolute;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 2px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      border: 1px solid #dcdcdc;
      width: 36px;
      z-index: 10;
    }
    .city-name {
      font-size: 0.6rem;
      font-weight: bold;
      color: #222;
      line-height: 1;
      margin-bottom: 2px;
    }
    .weather-icon {
      font-size: 1rem;
      line-height: 1;
    }
    .maxtemp {
      font-size: 0.55rem;
      font-weight: bold;
      color: #e53e3e;
      line-height: 1;
      margin-top: 2px;
    }
    .mintemp {
      font-size: 0.55rem;
      font-weight: bold;
      color: #2563eb;
      line-height: 1;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <FONT size="7" COLOR="WHITE">Kenta気象情報</FONT><BR>
  <div class="header-title"> 全国の気象情報</div>

  <div class="map-container">
    <img class="japan-map" src="map.jpg" alt="日本地図">
    <div id="map-content"></div>
  </div>

  <script>
    // 縦長カードが重ならないよう、日本列島の傾きに沿って座標を再調整
    const weatherData = [
      { city: "札幌", icon: "☁️", maxtemp: "22℃", mintemp: "10℃", x: 62, y: 18 },
      { city: "仙台", icon: "🌤️", maxtemp: "26℃", mintemp: "10℃", x: 66, y: 53 },
      { city: "新潟", icon: "☔", maxtemp: "25℃", mintemp: "10℃", x: 50, y: 40 },
      { city: "金沢", icon: "☔", maxtemp: "25℃", mintemp: "10℃", x: 40, y: 50 },
      { city: "長野", icon: "☀️", maxtemp: "31℃", mintemp: "10℃", x: 45, y: 68 },
      { city: "東京", icon: "☀️", maxtemp: "31℃", mintemp: "10℃", x: 57, y: 81 },
      { city: "名古屋", icon: "☀️", maxtemp: "32℃", mintemp: "10℃", x: 47, y: 87 },
      { city: "大阪", icon: "🌤️", maxtemp: "30℃", mintemp: "10℃", x: 35, y: 70 },
      { city: "広島", icon: "☀️", maxtemp: "31℃", mintemp: "10℃", x: 23, y: 65 },
      { city: "福岡", icon: "🌧️", maxtemp: "28℃", mintemp: "10℃", x: 10, y: 80 },
      { city: "鹿児島", icon: "⚡", maxtemp: "29℃", mintemp: "10℃", x: 30, y: 90 },
      { city: "那覇", icon: "☀️", maxtemp: "33℃", mintemp: "10℃", x: 85, y: 86 }
    ];

    const mapContent = document.getElementById("map-content");

    weatherData.forEach(item => {
      const card = document.createElement("div");
      card.className = "weather-card";
      card.style.left = item.x + "%";
      card.style.top = item.y + "%";

      card.innerHTML = `
        <div class="city-name">${item.city}</div>
        <div class="weather-icon">${item.icon}</div>
        <div class="maxtemp">${item.maxtemp}</div>
        <div class="mintemp">${item.mintemp}</div>
      `;

      mapContent.appendChild(card);
    });
    
  </script>

</body>

<BR>
明日は北日本と沖縄を中心に晴れ間が見え、洗濯日和となりそうです。北日本では湿度も低くカラッとした秋晴れが期待できそうです。<BR>
一方で西日本を中心に雨が降って、局地的には激しく降る恐れもあります。朝雨が降っていなくても折りたたみ傘があると安心です。<BR>
東京は曇り空。一時的に晴れ間があったり、にわか雨があったりと変わりやすい天気です。<BR><BR>

</html>
